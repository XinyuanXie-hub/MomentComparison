# Fill in the placeholders after Comparator passes.
project:
  name: "MomentComparison"
  description: "Verification that the optimal exponential base for the L2–L1 moment comparison on the Hamming cube is at least the square root of 3 and at most the constant from Eskenazis–Ivanisvili equation (191), as shown in the source."
  authors:
    - "Xinyuan Xie"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xinyuan Xie"

classification:
  arxiv: ["math.PR", "math.FA"]

sources:
  - title: "Grokability in five inequalities"
    authors: ["Paata Ivanisvili", "Xinyuan Xie"]
    id: "arXiv:2605.05193v1"
    relationship: "formalizes"

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        AI agents drafted and revised the Lean statement, implemented
        the proof, and ran verification under human direction.

review:
  status: "self-assessed"
  notes: >-
    The project owner reviewed and approved the statement and definitions
    before proof development. The solution passed Comparator with Lean,
    NanoDa, and con-ron.
