  description: "Verification that {{THEOREM_CLAIMS}}, as shown in the source."
  authors:
    - "{{FORMALIZATION_AUTHOR}}"
  license: "Apache-2.0"
  responsible_maintainers:
    - "{{FORMALIZATION_AUTHOR}}"

classification:
