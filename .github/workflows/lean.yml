name: Lean CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    name: Verify the Challenge against Solution
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Lean and restore Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
      - name: Install bubblewrap and configure user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Comparator with Lean, NanoDa, and con-ron
        run: |
          log=$(mktemp)
          if bash scripts/verify-comparator.sh >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            if [[ "$GITHUB_REPOSITORY" == 'XinyuanXie-hub/lean-verification-template' && "$status" == 2 ]] &&
               grep -Fxq 'error: nothing to check: the configuration names no theorems or definitions' "$log"; then
              echo '::warning::The blank template has no Comparator targets; no proof was verified.'
            else
              exit "$status"
            fi
          fi
